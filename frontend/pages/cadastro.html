<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - StudyAwards</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        .radio-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <main class="main-container">
        <header class="main-header">
            <h1>StudyAwards</h1>
            <p>Transforme o aprendizado em uma aventura gamificada</p>
        </header>

        <section class="login-form-container">
            <div class="login-card">
                <h2>Crie sua conta</h2>
                <p class="login-subtitle">Junte-se à plataforma</p>

                <form id="cadastro-form" class="login-form">
                    
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Digite seu nome" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email (será seu usuário)</label>
                        <input type="email" id="email" placeholder="Digite seu email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Crie uma senha" required>
                    </div>

                    <div class="form-group">
                        <label>Eu sou:</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="tipo" value="ALUNO" checked required>
                                Aluno
                            </label>
                            <label>
                                <input type="radio" name="tipo" value="PROFESSOR" required>
                                Professor
                            </label>
                            <label>
                                <input type="radio" name="tipo" value="RESPONSAVEL" required>
                                Responsável
                            </label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="../index.html" class="btn btn-secondary">Voltar</a>
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>

                    <p id="error-message" style="color: red; margin-top: 1rem; text-align: center;"></p>

                </form>
            </div>
        </section>
    </main>

    <script src="../scripts/cadastro.js" defer></script>
</body>
</html>
