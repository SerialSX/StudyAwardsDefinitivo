<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Registrar Instituição</title>
    
    <link rel="stylesheet" href="../styles/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <main class="main-container">
        <header class="main-header">
            <h1 style="color: var(--primary-color);">Painel Administrativo 🛡️</h1>
            <p style="color: var(--text-secondary);">Cadastro de Instituições de Ensino</p>
        </header>

        <section class="login-form-container">
            <div class="login-card" style="max-width: 600px;">
                <h2>Nova Instituição</h2>
                <p class="login-subtitle">Gere o código de acesso para os professores.</p>

                <form id="admin-form" class="login-form">
                    
                    <div class="form-group">
                        <label for="nomeInst">Nome da Instituição</label>
                        <input type="text" id="nomeInst" placeholder="Ex: Colégio Estrela do Saber" required>
                    </div>

                    <div class="form-group">
                        <label for="emailAdmin">Email do Responsável (Admin)</label>
                        <input type="email" id="emailAdmin" placeholder="diretoria@escola.com" required>
                    </div>

                    <div class="form-group">
                        <label for="plano">Plano de Assinatura</label>
                        <select id="plano" style="width: 100%; height: 52px; padding: 0 1.25rem; border: 2px solid #cbd5e1; border-radius: 12px; background-color: #f1f5f9; color: #0f172a; font-family: inherit;">
                            <option value="free">Básico (Gratuito)</option>
                            <option value="pro">Profissional</option>
                            <option value="enterprise">Enterprise</option>
                        </select>
                    </div>

                    <div id="resultado-container" style="display: none; background-color: #dcfce7; border: 1px solid #22c55e; padding: 1.5rem; border-radius: 12px; text-align: center; margin-top: 1rem; margin-bottom: 1rem;">
                        <p style="color: #166534; font-weight: 600; margin-bottom: 0.5rem;">Instituição Registrada com Sucesso!</p>
                        <p style="font-size: 0.9rem; color: #14532d;">O Código de Acesso para professores é:</p>
                        
                        <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px;">
                            <span id="codigo-gerado" style="font-size: 2rem; font-weight: 800; letter-spacing: 2px; color: #15803d;">---</span>
                            <button type="button" id="btn-copy" title="Copiar" style="background: none; border: none; cursor: pointer; font-size: 1.5rem;">📋</button>
                        </div>
                        <p style="font-size: 0.75rem; color: #14532d; margin-top: 10px;">Copie este código e insira no cadastro dos professores.</p>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='../index.html'">Voltar</button>
                        <button type="submit" class="btn btn-primary">Registrar e Gerar Código</button>
                    </div>

                </form>
            </div>
        </section>
    </main>
    
    <script src="../scripts/admin.js"></script>
    <script src="../scripts/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
